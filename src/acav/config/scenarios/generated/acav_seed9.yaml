# ACAV — Attitude-Coupled Access Verification
# Case-study scenario definition. THE contract for phases C2-C6.
#
# Every downstream phase reads this file rather than hardcoding values:
#   C2  builds the STK scenario from it
#   C3  parameterises the Simulink twin from it
#   C4  schedules against it
#   C5  runs experiments over it
#   C6  reports against it
#
# Values marked [ASSUMED] are defensible defaults chosen for this study,
# not measured properties of a real vehicle. Change them here and every
# phase follows. Values marked [DERIVED] are computed from others and
# must not be edited independently -- acav/spec.py recomputes and
# cross-checks them at load time.

scenario:
  name: ACAV_SSS1
  # Window start. A 12-minute window rather than a full orbit is a
  # deliberate, compute-budget-driven choice: at ~10 ms per closed-loop
  # step, a full 95-minute orbit costs ~10 min wall clock per run, which
  # makes the E4 gain sweep (49 runs) and E5 Monte Carlo (100 runs)
  # infeasible. See docs/C1_case_study_spec.md section 8.
  window_start_utc: "1 Jun 2024 10:30:00.000"
  window_duration_s: 720.0
  step_s: 0.1
  central_body: Earth

# ---------------------------------------------------------------------------
# Spacecraft: SSS-1, a 6U agile EO CubeSat
# ---------------------------------------------------------------------------
spacecraft:
  name: SSS-1
  object_path: "*/Satellite/SSS-1"

  orbit:
    # Matches backends/mock_backend.py's SSS1_DEFAULTS so mock-backend
    # development runs are geometrically comparable to STK runs.
    semi_major_axis_km: 6878.137     # ~500 km altitude, circular
    eccentricity: 0.0
    inclination_deg: 97.4             # sun-synchronous
    raan_deg: 0.0
    arg_perigee_deg: 0.0
    true_anomaly_deg: 0.0
    propagator: HPOP                  # truth propagator; see spec section 4

  mass_kg: 8.0                        # [ASSUMED] typical 6U with wheels

  # Body frame convention for this study:
  #   +Z = sensor boresight (nadir-pointing when unslewed)
  #   +X = along velocity
  #   +Y = completes the right-handed set (roughly orbit-normal)
  # Cross-track slews are therefore rotations about +X.
  inertia_kg_m2:                      # [ASSUMED] 6U 100x226x366 mm, 8 kg
    ixx: 0.123
    iyy: 0.096
    izz: 0.041
  # Products of inertia neglected: a symmetric 6U bus is close enough to
  # principal-axis aligned that including them would add model complexity
  # without changing any conclusion this study draws.

# ---------------------------------------------------------------------------
# Payload sensor
# ---------------------------------------------------------------------------
sensor:
  name: Imager
  object_path: "*/Satellite/SSS-1/Sensor/Imager"
  type: SimpleConic
  # 2.0 deg half-angle is the single most consequential parameter in the
  # study: it sets how much pointing error matters. At 500 km it gives a
  # ~35 km footprint diameter, and makes a 1 deg pointing error a
  # significant fraction of the field of view -- which is precisely the
  # regime where attitude dynamics decide capture success. A wide-FOV
  # sensor would make the whole effect disappear.
  half_angle_deg: 2.0
  boresight_body_axis: [0.0, 0.0, 1.0]    # +Z body

# ---------------------------------------------------------------------------
# Attitude control actuators
# ---------------------------------------------------------------------------
actuators:
  reaction_wheels:
    configuration: orthogonal_3axis        # aligned with body X, Y, Z
    max_torque_Nm: 0.002                   # [ASSUMED] 2 mNm, CubeSat class
    momentum_capacity_Nms: 0.020           # [ASSUMED] 20 mNms
    # Saturation at momentum_capacity triggers the SAFE transition in the
    # Stateflow chart (C3) and is the fault injected in E5.

  # [DERIVED] Cross-track slew limits, about the +X axis (ixx = 0.123):
  #   angular_accel = max_torque / ixx      = 0.01626 rad/s^2 = 0.93 deg/s^2
  #   max_rate      = momentum / ixx        = 0.1626 rad/s   = 9.32 deg/s
  #   triangular/trapezoidal crossover      = max_rate^2 / accel = 93.1 deg
  # Every slew in this study is below the crossover, so all profiles are
  # triangular. acav/slew_model.py recomputes these; do not hand-edit.

# ---------------------------------------------------------------------------
# Attitude control requirements
# ---------------------------------------------------------------------------
pointing:
  # Capture requires pointing error below this for settle_hold_s before
  # the image epoch. Set to a quarter of the sensor half-angle: tight
  # enough that settling behaviour matters, loose enough to be
  # achievable by a competent controller.
  capture_error_deg: 0.5
  settle_hold_s: 2.0
  # SLEW -> SETTLE transition threshold in the Stateflow chart.
  settle_entry_deg: 2.0
  # SAFE-mode trip: body rate exceeding this indicates loss of control.
  max_body_rate_deg_s: 15.0

# ---------------------------------------------------------------------------
# Imaging targets
# ---------------------------------------------------------------------------
targets:
  # Defined RELATIVE TO THE GROUND TRACK, not as fixed lat/lon.
  #
  # Hardcoded coordinates are fragile: shift the epoch and the satellite
  # is no longer over them, and the scenario silently yields zero access.
  # Instead C2 queries STK for the sub-satellite point at
  # (window_start + t_image_s), offsets it perpendicular to the ground
  # track by cross_track_km, and creates the target there. The scenario
  # is then reproducible at any epoch.
  #
  # cross_track_km sign: + is right of the velocity vector, - is left.
  #
  # DESIGN INTENT (not a predicted result): the gaps below deliberately
  # span three regimes so that E2 has something to measure --
  #   4 comfortable  (T1, T2, T4, T6): margins > +25 s
  #   1 knife-edge   (T3):             margin ~ +0.2 s
  #   2 infeasible   (T5, T7):         margins -1.9 s and -5.6 s
  # A kinematic scheduler attempts all 7; a dynamics-aware one should
  # decline at least T5 and T7. Whether each is ACTUALLY captured is
  # determined by the closed loop, not asserted here -- and a
  # disagreement between prediction and outcome is itself a result worth
  # reporting (see spec.feasibility_table()'s docstring).
  #
  # An earlier draft of this target set had every gap comfortably
  # feasible; test_spec.py::test_scenario_spans_feasible_and_marginal_regimes
  # caught it. That test guards the scenario's ability to produce a
  # result at all, and should not be relaxed to accommodate a
  # convenient target set.
  #
  # Estimated slew times use acav/slew_model.py's triangular profile plus
  # settle_estimate_s, and are informational only.
  placement: ground_track_relative

