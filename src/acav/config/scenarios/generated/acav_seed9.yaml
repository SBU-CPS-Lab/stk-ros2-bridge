# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
scheduling:
  # Extra margin added to the analytic slew time before a scheduler
  # decides a target is reachable. Represents controller settling that
  # the rigid-body slew model does not capture. C4's dynamics-aware
  # scheduler uses this; the kinematic scheduler ignores slew entirely.
  settle_estimate_s: 8.0
  # Time held on target before the image epoch (matches
  # pointing.settle_hold_s; duplicated here because the scheduler needs
  # it as a planning quantity, and spec.py cross-checks they agree).
  hold_before_image_s: 2.0
  return_to_nadir_between_targets: false
  # false: slew directly target-to-target, which is what an agile
  # spacecraft does and what makes the tight gaps interesting. Setting
  # true would insert a nadir dwell and change the study materially.

# ---------------------------------------------------------------------------
# Bridge configuration for this study
# ---------------------------------------------------------------------------
bridge:
  topic_prefix: stk
  namespace: sss_1
  execution_mode: lockstep
  barrier_participants: [matlab_twin, acav_scheduler]
  barrier_timeout_s: 30.0
  on_barrier_timeout: abort
  rate_groups:
    fast: 10.0       # attitude, body rate, orbit
    medium: 1.0      # target access, eclipse
    slow: 0.1        # ground-station contact, link
