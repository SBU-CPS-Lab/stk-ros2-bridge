# stk_bridge configuration for the ACAV case study.
#
# A copy of stk_bridge/config/bridge_params.yaml, not a reference to it,
# with the deltas this study needs (config/acav_scenario.yaml's `bridge:`
# section documents why). Kept as a separate file so the generic bridge
# configuration is unaffected by the case study.
#
#   ros2 launch stk_bridge stk_bridge.launch.py \
#       config_file:=$(pwd)/src/acav/config/bridge_params_acav.yaml
#
# Deltas from the base file, and why:
#   time.barrier_participants: adds acav_scheduler. The base file lists
#     only matlab_twin; ACAV adds a second barrier participant, and both
#     must ack every step or the run stalls against barrier_timeout_s.
#   scenario.scenario_name: matches config/acav_scenario.yaml's own
#     scenario.name (ACAV_SSS1), not the base file's generic
#     SSS1_DigitalTwin, so the bridge does not use an unrelated open
#     scenario with the same satellite name.
#
# scenario.use_existing reuses the open scenario after checking its name.
# COM attach_to_existing selects the application, not the scenario.
# scenario.scenario_path stays empty: the ACAV scenario is built in STK
# before the bridge is launched (see docs/acav/running_campaigns.md).

topic_prefix: stk
log_level: INFO

backend:
  type: com              # com | engine | connect | mock | auto
  com:
    attach_to_existing: true
    visible: true
    user_control: true
  engine:
    no_graphics: true
  connect:
    host: localhost
    port: 5001
    timeout_s: 10.0
    connect_timeout_s: 5.0
  mock:
    scenario_epoch: 1717200000.0
    satellite_name: SSS-1

worker:
  queue_size: 256
  full_policy: drop_oldest
  timeout_s: 30.0  # COM operations can exceed 5 s on the desktop
  start_timeout_s: 120.0

scenario:
  use_existing: true
  scenario_path: ""
  scenario_name: ACAV_SSS1
  ensure_objects:
    - type: Satellite
      name: SSS-1
  # STK propagates the orbit; MATLAB sends attitude commands only.
  # RealTime orbit propagation would discard the prebuilt ephemeris.
  # The actuation dispatcher enables streamed attitude on the first command.
  realtime_objects: []
  look_ahead_s: 3600.0
  look_behind_s: 3600.0
  require_astrogator: false
  require_coverage: false
  require_communications: false

validation:
  enabled: true
  fatal:
    ephemeris_present: true
    data_provider_returns_data: true
    distance_is_metres: true
    realtime_attitude_available: true
    quaternion_ordering: true
    angular_rate_scale: false
    monotonicity_enforced: false
    # Non-fatal, but read it: if it fails, a REUSED scenario rejects every
    # attitude command until the previous run's last sample time.
    attitude_history_clears: false

sensing:
  satellites:
    - "*/Satellite/SSS-1"
  position_frame: icrf
  velocity_frame: icrf
  lla_frame: fixed
  enable_lla: true
  enable_lighting: true
  enable_access: false
  enable_link_budget: false
  access_pairs: []
  # Opt-in, observe-only comparison of the current reads with the
  # optimised reads (core/equivalence_diagnostic.py). It inflates every
  # timing; enable it only for a diagnostic run.
  equivalence_diagnostic: false
  # Combined read: one 'Attitude Segment Quaternions' query serves attitude
  # and rate, only after the bridge proves at a written sample that
  # its quaternion equals 'Attitude Quaternions' (core/sensing.py).
  # run_acav_run.py turns it off for E1 and forced providers.
  combine_attitude_rate: true
  # Orbit batching: lockstep orbit reads from audited 100-epoch HPOP blocks
  # (core/orbit_batch.py). Both block ends must match instantaneous
  # reads within these strict tolerances or the block is not used.
  # Valid only while no force depends on attitude and nothing edits
  # the scenario outside the bridge; run_acav_run.py sets it to 1
  # for E1.
  orbit_batch_samples: 100
  orbit_batch_audit_position_m: 1.0e-6
  orbit_batch_audit_velocity_mps: 1.0e-9
  rate_groups:
    fast:   { rate_hz: 10.0 }
    medium: { rate_hz: 1.0 }
    slow:   { rate_hz: 0.1 }

actuation:
  # INERTIAL, unlike the base bridge: the ACAV twin computes attitude from
  # ICRF position, velocity and target vectors, so it must command
  # AddAttitude Quat and read back through 'Attitude Quaternions'. The
  # base pairing (CBFQuat / 'ECF Attitude Quaternions') is Earth-fixed;
  # used with this twin, every commanded attitude would land in STK
  # rotated by the Earth-rotation angle. Validation prefers this pairing
  # because of this setting, and the bridge refuses to start if the
  # validated read-back does not match it.
  default_attitude_inertial: true
  coalesce: true

time:
  mode: lockstep
  step_s: 0.1
  real_time_factor: 1.0
  barrier_participants:
    - matlab_twin
    - acav_scheduler
  barrier_timeout_s: 30.0  # wall seconds; allows desktop/Simulink scheduling delays
  on_barrier_timeout: abort
  publish_clock: true
  auto_step: true
  wait_for_startup_participants: true
  # Ack and command arrive on separate topics; wait for the next attitude.
  require_attitude_command_each_step: true

health:
  critical_channels: [orbit_position, attitude]
  stale_threshold: 5
  heartbeat_timeout_s: 10.0
  reconnect_enabled: true
  reconnect_initial_delay_s: 1.0
  reconnect_max_delay_s: 60.0
  reconnect_max_attempts: 0

qos:
  # A lockstep sample cannot be skipped: the next sample waits for its ack.
  telemetry_reliability: reliable
  telemetry_depth: 1
  command_depth: 10
  status_depth: 1
  clock_depth: 10

tf:
  enabled: true

executor:
  threads: 6

diagnostics:
  period_s: 5.0
