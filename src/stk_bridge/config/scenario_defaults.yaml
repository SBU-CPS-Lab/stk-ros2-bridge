# SSS-1 reference scenario defaults, factored out of bridge_params.yaml
# so alternate scenarios can be swapped in without touching the rest of
# the configuration. bridge_params.yaml's `scenario:` block takes
# precedence when both are loaded by the same launch file; this file is
# the fallback / documented baseline.

scenario:
  scenario_name: SSS1_DigitalTwin
  ensure_objects:
    - type: Satellite
      name: SSS-1
  realtime_objects:
    - "*/Satellite/SSS-1"
  # Confirmed on a live STK 12.6 install: neither LookAheadTime nor
  # LookBehindTime exist as Connect keywords or discoverable Object
  # Model properties on the RealTime propagator (the only match was
  # `Duration`, tried automatically by com_backend.py). These values are
  # therefore ASPIRATIONAL on 12.6 -- STK's built-in default governs
  # until AGI support confirms the correct property name. Track this in
  # docs/06_troubleshooting.md.
  look_ahead_s: 3600.0
  look_behind_s: 3600.0

# Nominal SSS-1 orbit, matching backends/mock_backend.py's SSS1_DEFAULTS,
# for anyone constructing a fresh scenario by hand rather than loading a
# .sc file. NOT the vehicle's real published elements -- replace with an
# actual TLE or ephemeris before using this for anything but bring-up.
sss1_nominal_orbit:
  semi_major_axis_km: 6878.137     # ~500 km altitude, circular
  eccentricity: 0.0
  inclination_deg: 97.4             # sun-synchronous regime
  raan_deg: 0.0
  arg_perigee_deg: 0.0
  true_anomaly_deg: 0.0
